<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Yellow Ops</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      html, body, #root { margin: 0; padding: 0; height: 100%; overflow: hidden; }
      *, *::before, *::after { box-sizing: border-box; }
      body { font-family: "Bricolage Grotesque", system-ui, -apple-system, sans-serif; color: #2B2720; -webkit-font-smoothing: antialiased; }
      button { font-family: inherit; }
      @keyframes yl-fade-in { from { opacity: 0; } to { opacity: 1; } }
      @keyframes yl-slide-in { from { transform: translateX(100%); } to { transform: translateX(0); } }
      @keyframes yl-slide-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
      @keyframes yl-pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.85); } }
      @keyframes yl-pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(74,148,66,0.55); } 70% { box-shadow: 0 0 0 8px rgba(74,148,66,0); } 100% { box-shadow: 0 0 0 0 rgba(74,148,66,0); } }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #E2DDD7; border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
