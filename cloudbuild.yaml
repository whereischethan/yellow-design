# ═══════════════════════════════════════════════════════════════════════════════
# Yellow Design Backend - Cloud Build Configuration
# ═══════════════════════════════════════════════════════════════════════════════
#
# Usage:
#   gcloud builds submit --config cloudbuild.yaml
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions _TAG=$(git rev-parse --short HEAD),_GIT_SHA=$(git rev-parse --short HEAD)
#
# ═══════════════════════════════════════════════════════════════════════════════

steps:
  # Build the Docker image (context is server/ directory)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/yellow-design/api:${_TAG}'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/yellow-design/api:latest'
      - '.'
    dir: 'server'

  # Push tagged image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/yellow-design/api:${_TAG}'

  # Push latest tag
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/yellow-design/api:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'yellow-design-backend'
      - '--image'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/yellow-design/api:${_TAG}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '3001'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--set-env-vars'
      - 'NODE_ENV=production,APP_VERSION=${_TAG}'
      - '--labels'
      - 'app=yellow-design-backend,deploy_tag=${_TAG},git_sha=${_GIT_SHA}'
      - '--set-secrets'
      - 'JWT_SECRET=jwt-secret:latest,DATABASE_URL=database-url:latest,MSG91_AUTHKEY=msg91-authkey:latest,MSG91_TEMPLATE_ID=msg91-template-id:latest,MSG91_TEMPLATE_BOOKING_CONFIRMED=msg91-tmpl-confirmed:latest,MSG91_TEMPLATE_DRIVER_ASSIGNED=msg91-tmpl-assigned:latest,MSG91_TEMPLATE_DRIVER_EN_ROUTE=msg91-tmpl-enroute:latest,MSG91_TEMPLATE_DRIVER_ARRIVED=msg91-tmpl-arrived:latest,MSG91_TEMPLATE_TRIP_COMPLETED=msg91-tmpl-completed:latest,MSG91_TEMPLATE_BOOKING_CANCELLED=msg91-tmpl-cancelled:latest,GOOGLE_MAPS_KEY=google-api-key:latest,FLIGHT_API_KEY=flight-api-key:latest,ALLOWED_ORIGINS=allowed-origins:latest,ADMIN_KEY=admin-key:latest,ADMIN_PHONES=admin-phones:latest,RAZORPAY_KEY_ID=razorpay-key-id:latest,RAZORPAY_KEY_SECRET=razorpay-key-secret:latest,RAZORPAY_WEBHOOK_SECRET=razorpay-webhook-secret:latest,MSG91_TEMPLATE_INVOICE_LINK=msg91-tmpl-invoice-link:latest'
      - '--add-cloudsql-instances'
      - '$PROJECT_ID:asia-south1:yellow-design-db'

# ═══════════════════════════════════════════════════════════════════════════════
# IMPORTANT: Before deploying, create these secrets in Secret Manager:
#   gcloud secrets create jwt-secret --replication-policy="automatic"
#   gcloud secrets create database-url --replication-policy="automatic"
#   gcloud secrets create msg91-authkey --replication-policy="automatic"
#   gcloud secrets create msg91-template-id --replication-policy="automatic"
#   gcloud secrets create google-api-key --replication-policy="automatic"
#   gcloud secrets create flight-api-key --replication-policy="automatic"
#   gcloud secrets create allowed-origins --replication-policy="automatic"
#   gcloud secrets create admin-key --replication-policy="automatic"
#
# Then add secret values:
#   echo -n "your-value" | gcloud secrets versions add jwt-secret --data-file=-
# ═══════════════════════════════════════════════════════════════════════════════

substitutions:
  _REGION: 'asia-south1'
  _TAG: 'manual'
  _GIT_SHA: 'unknown'

options:
  logging: GCS_ONLY

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/yellow-design/api:${_TAG}'
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/yellow-design/api:latest'

timeout: '600s'
